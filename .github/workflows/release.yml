name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Envialo ${{ github.ref_name }}"
          releaseBody: "Ver los cambios de esta versión más abajo."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  organize-assets:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Group downloads by platform in the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          base_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"

          windows=$(echo "$assets" | grep -E '\.(exe|msi)$' | awk -v base="$base_url" '{print "- ["$0"]("base"/"$0")"}')
          mac=$(echo "$assets" | grep -E '\.(dmg|app\.tar\.gz)$' | awk -v base="$base_url" '{print "- ["$0"]("base"/"$0")"}')

          {
            echo "## Windows"
            echo "$windows"
            echo ""
            echo "## macOS"
            echo "$mac"
          } > notes.md

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
